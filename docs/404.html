<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — asset-inventory</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var moved = /\/release-notes-(v\d+\.\d+\.\d+)\.md$/;
    if (moved.test(location.pathname)) {
      location.replace(location.pathname.replace(moved, '/release-notes/release-notes-$1.md'));
      return;
    }
    var home = document.getElementById('home');
    if (home) home.href = location.origin + '/' + (location.pathname.split('/')[1] || '') + '/';
  })();
</script>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page doesn't exist. If you followed an old release-notes link, those files now live under <code>release-notes/</code>.</p>
  <p><a id="home" href="index.html">Go to the overview</a></p>
</main>
</body>
</html>
