name: Docs checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check scripts
        run: node --check scripts/check-docs.mjs && node --check scripts/generate-assets.mjs && node --check scripts/build-sample-pages.mjs

      - name: Validate documentation
        run: node scripts/check-docs.mjs

      - name: Verify generated sample pages are up to date
        run: node scripts/build-sample-pages.mjs --check
